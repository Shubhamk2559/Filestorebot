:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--f);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--wall) center/cover no-repeat,var(--bg)}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:18px 14px 130px}
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border-radius:26px;box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge),var(--drop)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:10px;margin:2px 4px 18px}
.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center}
.brand{font:600 17px var(--fd);letter-spacing:.012em}
.badge{display:flex;width:max-content;margin:0 0 14px;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;color:var(--jade-ink);background:rgb(var(--jade-bg));box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px rgba(20,168,116,.3)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--jade)}
.hero{margin:0 4px 20px}
h1{font:600 38px/1.05 var(--fd);letter-spacing:-.015em;margin:0}
h1 span{display:block;color:var(--t3)}
.hero p{margin:12px 0 0;color:var(--t2);max-width:30ch}
.hero{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);padding:22px 20px;border-radius:26px;margin:0 0 12px}
.prom{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:18px;border-radius:99px;color:#fff;font:600 16px var(--f);background:linear-gradient(180deg,#2e89f2,#0067d9 55%,#0058bb);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -8px 14px -8px rgba(150,205,255,.6),0 10px 22px -10px rgba(0,103,217,.8);transition:translate .2s var(--ease),box-shadow .2s var(--ease)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 4px;margin-bottom:12px;text-align:center}
.stats div+div{border-left:1px solid var(--hair)}
.stats b{display:block;font:600 21px var(--fd);letter-spacing:-.015em}.stats span{font-size:12.5px;color:var(--t2)}
.sec{padding:16px 12px 12px;margin-bottom:12px}
h2{margin:0 6px 12px;font:600 17px var(--fd);letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:10px;min-height:64px;padding:10px;border-radius:18px;text-align:left;background:var(--fill);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--hair),var(--slab);translate:0 -1px;transition:translate .2s var(--ease),box-shadow .2s var(--ease),transform .75s var(--ease) calc(var(--k,0)*55ms)}
.chip{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--fill2);box-shadow:inset 0 1px 0 var(--hi)}
.tx b{display:block;font-weight:600;font-size:14.5px;line-height:1.2}.tx small{display:block;color:var(--t2);font-size:12.5px;line-height:1.25;margin-top:1px}
@media (hover:hover){.tile:hover,.prom:hover{translate:0 0}.tile:hover{box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--hair),0 1px 2px rgba(0,0,0,.12)}}
.tile:active,.prom:active,.reset:active{translate:0 1px;box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--hair)}
.rows{border-radius:18px;background:var(--fill);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--hair)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}.row+.row{border-top:1px solid var(--hair)}.row .tx{flex:1}
.sw{position:relative;width:51px;height:31px;border-radius:99px;flex:none;background:rgba(120,120,128,.34);box-shadow:inset 0 0 0 1px var(--hair)}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sw.on{background:var(--blue)}.sw.on i{translate:20px 0}
.seg{display:flex;padding:3px;border-radius:99px;background:var(--fill2);box-shadow:inset 0 0 0 1px var(--hair)}
.seg i{font-style:normal;font-weight:600;font-size:12.5px;color:var(--t2);padding:5px 10px;border-radius:99px}
.seg i.on{background:var(--bub);color:var(--text);box-shadow:var(--bubsh)}
.val{font:600 17px var(--fd);color:var(--t2);padding-right:4px}
.reset{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:99px;color:var(--rose);font-weight:600;font-size:16px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--edge),var(--slab);transition:translate .2s var(--ease)}

function reveal(){
  var els=document.querySelectorAll('.sc:not(.in)');
  if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion:reduce)').matches){
    var io=new IntersectionObserver(function(a){a.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}})},{threshold:.08,rootMargin:'0px 0px -4% 0px'});
    els.forEach(function(e){io.observe(e)});
  }else els.forEach(function(e){e.classList.add('in')});
}

RENDER.bc=function(){
  return Promise.all([api('bc_count'),api('bc_status')]).then(function(r){
    var total=r[0].total,st=r[1];
    setBody(card('Message everyone','<p class="muted" style="margin:0 0 10px">Goes to <b>'+N(total)+'</b> users (banned and blocked users are skipped). HTML works: &lt;b&gt;bold&lt;/b&gt;, &lt;i&gt;italic&lt;/i&gt;, &lt;a href="…"&gt;link&lt;/a&gt;.</p><textarea id="bt" placeholder="Write your message…" maxlength="4000"></textarea><div class="muted" style="text-align:right;margin-top:4px" id="bcnt">0 / 4000</div><div class="row2"><button class="btn sec" data-act="test">Send test to me</button><button class="btn" data-act="send">Send to all</button></div>')+'<div id="bprog"></div>');
    var t=$('#bt');t.addEventListener('input',function(){$('#bcnt').textContent=t.value.length+' / 4000'});
    H.test=function(b){run(b,function(){return api('bc_send',{text:t.value,test:1}).then(function(){toast('Test sent to your chat')})})};
    H.send=function(b){

        run(b,function(){return api('bc_send',{text:t.value}).then(function(){toast('Broadcast started');t.value='';$('#bcnt').textContent='0 / 4000';poll()})})});
    };

  });
};
function drawBc(s){
  var pct=s.total?Math.round(s.done*100/s.total):(s.finished?100:0);
  $('#bprog').innerHTML=card(s.finished?'✅ Broadcast finished':'📢 Broadcasting…','<span class="bar"><i style="width:'+pct+'%;animation:none"></i></span><div class="kv"><span>Progress</span><b>'+N(s.done)+' / '+N(s.total)+' ('+pct+'%)</b></div><div class="kv"><span>✅ Sent</span><b>'+N(s.sent)+'</b></div><div class="kv"><span>🚫 Blocked / unreachable</span><b>'+N(s.blocked)+'</b></div><div class="kv"><span>⚠️ Failed</span><b>'+N(s.failed)+'</b></div>');
}
function poll(){stopTimer();var name='bc';var tick=function(){api('bc_status').then(function(s){if(cur!==name){stopTimer();return}if(s&&!s.idle)drawBc(s);if(!s||s.idle||s.finished)stopTimer()}).catch(function(){})};tick();timer=setInterval(tick,1500)}

    return '<div class="li">'+who(u)+'<button type="button" class="btn sec sm" data-act="bn" data-s="unban" data-v="'+u.id+'">Unban</button></div>'}).join('')
    +(d.total>d.shown?'<p class="muted" style="margin:10px 0 0">Showing the first '+d.shown+' of '+N(d.total)+'.</p>':'')
    +'<button type="button" class="btn red" data-act="bnall">Unban everyone</button>':'<div class="muted">Nobody is banned.</div>');
  setBody(h);
  H.bn=function(el){
    var s=el.dataset.s,v=el.dataset.v||($('#bnid')?$('#bnid').value.trim():'');
    if(!v){toast('Send the user ID first',true);return}
    var go=function(){return run(el,function(){return api('ban',{set:s,value:v}).then(function(r){drawBn(r);toast(s==='ban'?'🚫 Banned '+v:'✅ Unbanned '+v)})})};
    if(s==='ban')confirmBox('Ban user '+v+'?').then(function(ok){if(ok)go()});else go();
  };
  H.bnall=function(b){confirmBox('Unban all '+N(d.total)+' users?').then(function(ok){if(ok)run(b,function(){return api('ban',{set:'unban_all'}).then(function(r){drawBn(r);toast('Everyone unbanned')})})})};
  H.bnchat=function(){run(null,function(){return openInBot('ban')})};
}

/* ----- Access: Admins (owner only) ----- */
RENDER.admins=function(){return api('admins').then(drawAd)};
function drawAd(d){
  var h=card('Owner','<div class="li">'+who(d.owner)+'<span class="tag">Owner</span></div><p class="muted" style="margin:6px 0 0">The owner is always an admin and can’t be removed.</p>');
  h+=card('Admins ('+d.admins.length+')',d.admins.length?d.admins.map(function(u){
    return '<div class="li">'+who(u)+'<button type="button" class="btn sec sm" data-act="ad" data-s="rm" data-v="'+u.id+'">Remove</button></div>'}).join(''):'<div class="muted">No extra admins yet.</div>');
  h+=card('Add an admin','<input type="text" id="adid" inputmode="numeric" placeholder="Telegram user ID, e.g. 123456789" autocomplete="off"><button type="button" class="btn" data-act="adadd">Add admin</button>'
   +'<button type="button" class="btn sec" data-act="adchat">Add by forwarded message (in chat)</button>'
   +'<p class="muted" style="margin:10px 0 0">Admins can use this panel and are not asked to join force-sub channels. Only the owner can manage admins, backups and transfers.</p>');
  setBody(h);
  var call=function(b,data,msg){return run(b,function(){return api('admins',data).then(function(r){drawAd(r);toast(msg)})})};
  H.ad=function(el){var v=el.dataset.v;confirmBox('Remove admin '+v+'?').then(function(ok){if(ok)call(el,{set:'rm',value:v},'Admin removed')})};
  H.adadd=function(b){var v=$('#adid').value.trim();if(!v){toast('Send the user ID first',true);return}call(b,{set:'add',value:v},'Admin added')};
  H.adchat=function(){run(null,function(){return openInBot('admins')})};
}

/* ----- Earnings ----- */
RENDER.earnings=function(){
  return api('earnings').then(function(d){
    var t=d.table,cols=['today','d7','d30','all'];
    var row=function(l,k,f){return '<tr><td>'+l+'</td>'+cols.map(function(c){return '<td>'+f(t[k][c])+'</td>'}).join('')+'</tr>'};
    var h=card('📈 Earnings &amp; analytics','<div class="tw"><table class="t"><tr><th></th><th>Today</th><th>7d</th><th>30d</th><th>All</th></tr>'
     +row('Earned','rev',Mo)+row('Views','views',N)+row('Ads shown','imp',N)+row('Clicks','clk',N)+row('Ad gates','gates',N)+row('Verified','verified',N)+row('Free files','fallback',N)+row('Blocked','blocked',N)+row('New users','users',N)+'</table></div>'
     +'<div class="kv"><span>eCPM (30d)</span><b>'+(d.ecpm==null?'—':Mo(d.ecpm))+' / 1000 ads</b></div>'+(d.note?'<div class="note">'+esc(d.note)+'</div>':'')+'<p class="muted" style="margin:10px 0 0">Earnings are Monetag’s estimate; the final payout is in your Monetag dashboard. Days change at 12:00 AM IST.</p>');
    h+=card('📅 Last 14 days','<div class="tw"><table class="t"><tr><th>Date</th><th>Earned</th><th>Views</th><th>Ads</th><th>Users</th></tr>'+d.daily.map(function(x){return '<tr><td>'+esc(x.d)+'</td><td>'+Mo(x.rev)+'</td><td>'+N(x.views)+'</td><td>'+N(x.imp)+'</td><td>'+N(x.users)+'</td></tr>'}).join('')+'</table></div>');
    h+=card('🏆 Top links',d.top.length?d.top.map(function(x,i){return '<div class="kv"><span>'+(i+1)+'. '+esc(x.label)+'</span><b>'+N(x.views)+' views</b></div>'}).join(''):'<div class="muted">No link has been opened yet.</div>');
    setBody(h);
  });
};

/* ----- Backup ----- */
RENDER.backup=function(){return api('backup').then(drawBk)};
function drawBk(d){
  setBody(card('💾 Backup / Restore','<p class="muted" style="margin:0 0 6px">Settings, links, files, users and Autoposter in one file.</p><div class="kv"><span>Last backup</span><b>'+ago(d.last)+'</b></div><div class="kv"><span>Auto-backup (every 24 h)</span>'+sw(d.auto,'data-act="auto"')+'</div><button class="btn" data-act="now">📥 Backup now</button><p class="muted" style="margin:10px 0 0">The file is sent to your chat with the bot — forward it to Saved Messages.</p>')
   +card('📤 Restore','<p class="muted" style="margin:0">To restore, simply send the <code>fsb-backup-….json.gz</code> file to the bot chat, then choose <b>Replace</b> or <b>Merge</b>. If it came in several parts, send all of them.</p><button class="btn sec" data-act="rs">Open Restore in chat</button>'));
  H.auto=function(){run(null,function(){return api('backup_auto').then(drawBk).then(function(){toast('Updated')})})};
  H.now=function(b){run(b,function(){return api('backup_now').then(function(r){toast('Backup sent to your chat · '+N(r.counts.users)+' users, '+N(r.counts.links)+' links');return api('backup').then(drawBk)})})};
  H.rs=function(){run(null,function(){return openInBot('bk')})};
}

/* ----- Transfer ----- */
RENDER.transfer=function(){
  return api('transfer').then(function(d){
    var h;
    if(!d.available)h=card('🔄 Transfer','<div class="note">⚠️ '+esc(d.reason)+'</div>');
    else{
      h=card('🔄 Transfer','<p class="muted" style="margin:0 0 6px">Copy everything from a private channel / chat into another channel, chat or Saved Messages — same files, same captions, no forward tag.</p><div class="kv"><span>Account</span><b>'+(d.logged_in?'✅ '+esc(d.name)+(d.username?' @'+esc(d.username):''):'❌ Not logged in')+'</b></div>');
      if(d.job){var j=d.job,pct=j.total?Math.round((j.copied+j.failed+j.skipped)*100/j.total):0;
        h+=card((j.running?'⏳ ':'✅ ')+'Current / last job','<div class="kv"><span>From → To</span><b>'+esc(j.src)+' → '+esc(j.dst)+'</b></div><span class="bar" style="margin:8px 0"><i style="width:'+Math.min(100,pct)+'%;animation:none"></i></span><div class="kv"><span>State</span><b>'+esc(j.state)+(j.paused?' (paused)':'')+'</b></div><div class="kv"><span>Copied · failed · skipped</span><b>'+N(j.copied)+' · '+N(j.failed)+' · '+N(j.skipped)+' of '+N(j.total)+'</b></div>');
        if(j.running){stopTimer();var name='transfer';timer=setInterval(function(){if(cur!==name){stopTimer();return}load(true)},4000)}}
      h+='<button class="btn" data-act="tr">'+(d.logged_in?'🚀 Manage / new transfer in chat':'📱 Log in in chat')+'</button><p class="muted" style="margin:10px 0 0">Login (phone code) and choosing chats need typing, so those steps open in the bot chat.</p>';
    }
    setBody(h);H.tr=function(){run(null,function(){return openInBot('tr')})};
  });
};

/* ----- VPS ----- */
RENDER.vps=function(){
  return api('vps').then(function(d){
    if(!d.supported){setBody(card('🖥 VPS usage','<div class="note">⚠️ Needs a Linux server (/proc not found).</div>'));return}
    var h='';
    if(d.now){var n=d.now;h+=card('⚡ Right now','<div class="grid3"><div class="mini"><b>'+Math.round(n.cpu)+'%</b><span>CPU</span></div><div class="mini"><b>'+Math.round(n.ram)+'%</b><span>RAM</span></div><div class="mini"><b>'+(n.streams||0)+'</b><span>Streaming</span></div></div><div class="kv"><span>RAM</span><b>'+((n.ram_used_mb||0)/1024).toFixed(1)+' / '+((n.ram_total_mb||0)/1024).toFixed(1)+' GB</b></div><div class="kv"><span>Speed</span><b>'+(n.mbps||0)+' Mbps</b></div><div class="kv"><span>Bot process</span><b>'+Math.round(n.bot_rss_mb||0)+' MB</b></div><div class="kv"><span>Disk</span><b>'+(n.disk_used_gb||0)+' / '+Math.round(n.disk_total_gb||0)+' GB</b></div>')}
    if(!d.has_data)h+=card('📊 History','<div class="empty">No data yet. The bot saves a sample every 5 minutes — check again soon.</div>');
    else{
      var r=d.rows,L=[['Today',r.today],['7 days',r.d7],['30 days',r.d30]];
      h+=card('📊 Usage (avg / peak)','<div class="tw"><table class="t"><tr><th></th><th>CPU%</th><th>RAM%</th><th>Out</th><th>Mbps</th></tr>'+L.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1].cpu+'/'+x[1].cpu_max+'</td><td>'+x[1].ram+'/'+x[1].ram_max+'</td><td>'+Bytes(x[1].out)+'</td><td>'+x[1].mbps+'</td></tr>'}).join('')+'</table></div>');
      h+=card('📅 Last 7 days','<div class="tw"><table class="t"><tr><th>Date</th><th>CPU%</th><th>RAM%</th><th>Out</th><th>Mbps</th></tr>'+d.daily.map(function(x){return x.cpu==null?'<tr><td>'+esc(x.d)+'</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>':'<tr><td>'+esc(x.d)+'</td><td>'+x.cpu+'/'+x.cpu_max+'</td><td>'+x.ram+'/'+x.ram_max+'</td><td>'+Bytes(x.out)+'</td><td>'+x.mbps+'</td></tr>'}).join('')+'</table></div>');
      if(d.advice){var a=d.advice;h+=card('💡 Plan advice',a.undersized?'<div class="note">⚠️ Even the biggest plan in the list is tight for this usage.</div>':'<div class="kv"><span>Recommended</span><b>'+esc(a.plan)+'</b></div><div class="kv"><span>Spec</span><b>'+a.cores+' vCPU · '+a.ram_gb+' GB · '+a.disk_gb+' GB</b></div><div class="kv"><span>Price</span><b>'+esc(a.price)+'/month</b></div>'+(a.current?'<div class="kv"><span>Your VPS looks like</span><b>'+esc(a.current)+'</b></div>':'')+'<p class="muted" style="margin:8px 0 0">Based on '+a.days+' day(s) of real usage.</p>')}
    }
    setBody(h);
  });
};

/* ---------- theme (kept from the design) ---------- */
(function(){var h=document.documentElement,K='fsb-theme',w=document.querySelector('.theme'),b=w.querySelectorAll('button');
function set(t,v){h.setAttribute('data-theme',t);w.style.setProperty('--p',['light','dark','auto'].indexOf(t));b.forEach(function(x){x.setAttribute('aria-pressed',x.dataset.t===t)});if(v){try{localStorage.setItem(K,t)}catch(e){}}}
var s='auto';try{s=localStorage.getItem(K)||'auto'}catch(e){}set(s);
b.forEach(function(x){x.addEventListener('click',function(){var t=x.dataset.t;if(document.startViewTransition){document.startViewTransition(function(){set(t,1)})}else set(t,1)})})})();
var tp=document.querySelector('.top'),tk=false;
var stuck=false;addEventListener('scroll',function(){if(!tk){tk=true;requestAnimationFrame(function(){var s=scrollY>28;if(s!==stuck){stuck=s;tp.classList.toggle('stuck',s)}tk=false})}},{passive:true});
loadHome();
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!cur)loadHome()});
})();
</script>
